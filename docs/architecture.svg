<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A84FF"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1F2328}
      .s{font-size:12.5px;fill:#57606A}
      .h{font-size:17px;font-weight:700}
      .lbl{font-size:12px;fill:#57606A}
      .ln{stroke:#57606A;stroke-width:1.6;fill:none}
      .lb{stroke:#0A84FF;stroke-width:2;fill:none}
      .b{fill:#0A84FF}
      .bt{font-size:12px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="728" rx="18" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- iOS app -->
  <rect x="40" y="28" width="880" height="150" rx="14" fill="#EAF2FF" stroke="#0A84FF" stroke-width="1.5"/>
  <text x="60" y="56" class="h" fill="#0A6CD6">iOS app</text>
  <text x="140" y="56" class="s">app/ · SwiftUI, the whole user experience</text>
  <g>
    <rect x="60" y="78" width="195" height="78" rx="10" fill="#fff" stroke="#B6D4FE"/>
    <text x="157" y="110" class="t" text-anchor="middle">Today</text>
    <text x="157" y="131" class="s" text-anchor="middle">agenda · tap to mark done</text>
    <rect x="275" y="78" width="195" height="78" rx="10" fill="#fff" stroke="#B6D4FE"/>
    <text x="372" y="110" class="t" text-anchor="middle">Log</text>
    <text x="372" y="131" class="s" text-anchor="middle">food · workouts · weight</text>
    <rect x="490" y="78" width="195" height="78" rx="10" fill="#fff" stroke="#B6D4FE"/>
    <text x="587" y="110" class="t" text-anchor="middle">Chat</text>
    <text x="587" y="131" class="s" text-anchor="middle">text · voice · photo</text>
    <rect x="705" y="78" width="195" height="78" rx="10" fill="#fff" stroke="#B6D4FE"/>
    <text x="802" y="110" class="t" text-anchor="middle">Lock screen</text>
    <text x="802" y="131" class="s" text-anchor="middle">Now / Next Live Activity</text>
  </g>

  <!-- Server panel -->
  <rect x="40" y="250" width="700" height="450" rx="14" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/>
  <text x="60" y="280" class="h" fill="#1F2328">Server</text>
  <text x="130" y="280" class="s">server/ · Python, FastAPI, PostgreSQL</text>

  <!-- Row A: things that start a turn -->
  <rect x="70" y="300" width="170" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="155" y="327" class="t" text-anchor="middle">Calendar sync</text>
  <text x="155" y="347" class="s" text-anchor="middle">ICS feeds, read-only</text>
  <rect x="285" y="300" width="170" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="370" y="327" class="t" text-anchor="middle">Scheduler</text>
  <text x="370" y="347" class="s" text-anchor="middle">a reminder comes due</text>
  <rect x="500" y="300" width="170" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="585" y="327" class="t" text-anchor="middle">API</text>
  <text x="585" y="347" class="s" text-anchor="middle">chat · panes · MCP</text>

  <!-- Postgres -->
  <path d="M250,436 a120,14 0 0,1 240,0 v74 a120,14 0 0,1 -240,0 z" fill="#E6F6F1" stroke="#1F9D73" stroke-width="1.5"/>
  <ellipse cx="370" cy="436" rx="120" ry="14" fill="#D3F0E6" stroke="#1F9D73" stroke-width="1.5"/>
  <text x="370" y="473" class="t" text-anchor="middle">PostgreSQL</text>
  <text x="370" y="492" class="s" text-anchor="middle">triggers · state · push outbox</text>
  <text x="370" y="508" class="s" text-anchor="middle" font-size="11.5">row-level security per user</text>

  <!-- Push sender -->
  <rect x="545" y="435" width="165" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="627" y="462" class="t" text-anchor="middle">Push sender</text>
  <text x="627" y="482" class="s" text-anchor="middle">drains the outbox</text>

  <!-- Row C: the turn -->
  <rect x="70" y="610" width="170" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="155" y="637" class="t" text-anchor="middle">Turn worker</text>
  <text x="155" y="657" class="s" text-anchor="middle">fresh context snapshot</text>
  <rect x="285" y="610" width="170" height="64" rx="10" fill="#FFF4E5" stroke="#D97706"/>
  <text x="370" y="637" class="t" text-anchor="middle">Claude</text>
  <text x="370" y="657" class="s" text-anchor="middle">reply + commands[]</text>
  <rect x="500" y="610" width="170" height="64" rx="10" fill="#EAF7EA" stroke="#2DA44E"/>
  <text x="585" y="637" class="t" text-anchor="middle">Validate + commit</text>
  <text x="585" y="657" class="s" text-anchor="middle">one transaction</text>

  <!-- APNs (outside server) -->
  <rect x="775" y="435" width="135" height="64" rx="10" fill="#fff" stroke="#D0D7DE"/>
  <text x="842" y="462" class="t" text-anchor="middle">APNs</text>
  <text x="842" y="482" class="s" text-anchor="middle">Apple push</text>

  <!-- Arrows -->
  <!-- app chat <-> API -->
  <line x1="587" y1="159" x2="587" y2="296" class="lb" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="600" y="214" class="lbl">message in,</text>
  <text x="600" y="230" class="lbl">reply streams back</text>
  <!-- row A -> PG -->
  <line x1="170" y1="366" x2="285" y2="428" class="ln" marker-end="url(#a)"/>
  <line x1="370" y1="366" x2="370" y2="418" class="ln" marker-end="url(#a)"/>
  <line x1="565" y1="366" x2="455" y2="428" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- PG -> worker -->
  <line x1="290" y1="522" x2="185" y2="606" class="ln" marker-end="url(#a)"/>
  <!-- worker -> claude -> validate -->
  <line x1="242" y1="642" x2="281" y2="642" class="ln" marker-end="url(#a)"/>
  <line x1="457" y1="642" x2="496" y2="642" class="ln" marker-end="url(#a)"/>
  <!-- validate -> PG -->
  <line x1="560" y1="606" x2="455" y2="526" class="ln" marker-end="url(#a)"/>
  <!-- PG -> push sender -> APNs -> phone -->
  <line x1="492" y1="467" x2="541" y2="467" class="ln" marker-end="url(#a)"/>
  <line x1="712" y1="467" x2="771" y2="467" class="ln" marker-end="url(#a)"/>
  <line x1="842" y1="431" x2="842" y2="161" class="lb" marker-end="url(#ab)"/>
  <text x="852" y="300" class="lbl">push +</text>
  <text x="852" y="316" class="lbl">Live Activity</text>

  <!-- step badges -->
  <g><circle cx="370" cy="392" r="11" class="b"/><text x="370" y="396" class="bt" text-anchor="middle">1</text></g>
  <g><circle cx="237" cy="559" r="11" class="b"/><text x="237" y="563" class="bt" text-anchor="middle">2</text></g>
  <g><circle cx="262" cy="624" r="11" class="b"/><text x="262" y="628" class="bt" text-anchor="middle">3</text></g>
  <g><circle cx="508" cy="560" r="11" class="b"/><text x="508" y="564" class="bt" text-anchor="middle">4</text></g>
  <g><circle cx="742" cy="448" r="11" class="b"/><text x="742" y="452" class="bt" text-anchor="middle">5</text></g>
</svg>

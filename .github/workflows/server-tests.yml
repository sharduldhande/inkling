name: server-tests

on:
  push:
    paths: ["server/**", ".github/workflows/**"]
  pull_request:
    paths: ["server/**", ".github/workflows/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkling_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # The suite drops and recreates the schema; conftest refuses any URL
      # without a "test" marker, so this throwaway container is the only target.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkling_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
